name: Frontend CI/CD (S3 + CloudFront)

on:
  push:
    branches: [ main ]
    paths:
      - 'proTecht/Frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      FRONTEND_S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
      CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        working-directory: proTecht/Frontend
        run: npm ci

      - name: Build
        working-directory: proTecht/Frontend
        run: npm run build

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync proTecht/Frontend/dist s3://$FRONTEND_S3_BUCKET --delete --cache-control max-age=300

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DIST_ID" --paths '/*'


